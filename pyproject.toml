[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmlab"
version = "0.1.0"
description = "Сравнение архитектурных вариаций маленьких LLM на русском корпусе (чистый PyTorch)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "tokenizers>=0.15",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
wandb = ["wandb"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
